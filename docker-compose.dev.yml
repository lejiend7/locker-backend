services:
  app:
    image: 905846953702.dkr.ecr.ap-southeast-5.amazonaws.com/locker-backend:${APP_IMAGE_TAG:-dev-latest}
    pull_policy: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
    restart: unless-stopped
