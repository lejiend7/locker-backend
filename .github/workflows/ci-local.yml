name: CI Local

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  unit-tests:
    uses: ./.github/workflows/ci-unit-tests.yml

  security-check:
    uses: ./.github/workflows/ci-security-check.yml
    needs: unit-tests

  build-local-image:
    name: Build Local Image
    runs-on: ubuntu-latest
    needs: [unit-tests, security-check]
    steps:
      - uses: actions/checkout@v4

      - name: Build local Docker image
        run: |
          docker build \
            -f Dockerfile.local \
            --target production \
            -t $ECR_REPOSITORY:local-latest \
            -t $ECR_REPOSITORY:local-${{ github.sha }} \
            .

      - name: Export local image artifact
        run: docker save $ECR_REPOSITORY:local-latest -o local-image.tar

      - name: Upload local image artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-image
          path: local-image.tar

  image-scan:
    uses: ./.github/workflows/ci-image-scan.yml
    needs: build-local-image
    with:
      artifact-name: local-image
      image-ref: ${{ env.ECR_REPOSITORY }}:local-latest

  push-local-image:
    name: Push Local Image
    runs-on: ubuntu-latest
    needs: image-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION \
            | docker login --username AWS --password-stdin $ECR_REGISTRY

      - name: Download local image artifact
        uses: actions/download-artifact@v4
        with:
          name: local-image

      - name: Load local image from artifact
        run: docker load -i local-image.tar

      - name: Tag and push local image to ECR
        run: |
          docker tag $ECR_REPOSITORY:local-latest $ECR_REGISTRY/$ECR_REPOSITORY:local-latest
          docker tag $ECR_REPOSITORY:local-${{ github.sha }} $ECR_REGISTRY/$ECR_REPOSITORY:local-${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:local-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:local-${{ github.sha }}

      - name: Enforce ECR image retention (keep 5 latest)
        run: |
          aws ecr put-lifecycle-policy \
            --repository-name $ECR_REPOSITORY \
            --lifecycle-policy-text '{
              "rules": [
                {
                  "rulePriority": 1,
                  "description": "Keep only 5 latest images",
                  "selection": {
                    "tagStatus": "any",
                    "countType": "imageCountMoreThan",
                    "countNumber": 5
                  },
                  "action": { "type": "expire" }
                }
              ]
            }'
