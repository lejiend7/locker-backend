name: CI Local

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  unit-tests:
    uses: ./.github/workflows/ci-unit-tests.yml

  ci-local:
    name: CI Local
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Build local Docker image
        run: |
          docker build \
            -f Dockerfile.local \
            --target production \
            -t $ECR_REPOSITORY:local-latest \
            -t $ECR_REPOSITORY:local-${{ github.sha }} \
            .

      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          aws ecr get-login-password --region $AWS_REGION \
            | docker login --username AWS --password-stdin $ECR_REGISTRY

      - name: Tag and push local image to ECR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker tag $ECR_REPOSITORY:local-latest $ECR_REGISTRY/$ECR_REPOSITORY:local-latest
          docker tag $ECR_REPOSITORY:local-${{ github.sha }} $ECR_REGISTRY/$ECR_REPOSITORY:local-${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:local-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:local-${{ github.sha }}

      - name: Enforce ECR image retention (keep 5 latest)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          aws ecr put-lifecycle-policy \
            --repository-name $ECR_REPOSITORY \
            --lifecycle-policy-text '{
              "rules": [
                {
                  "rulePriority": 1,
                  "description": "Keep only 5 latest images",
                  "selection": {
                    "tagStatus": "any",
                    "countType": "imageCountMoreThan",
                    "countNumber": 5
                  },
                  "action": { "type": "expire" }
                }
              ]
            }'
