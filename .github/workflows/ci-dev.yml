name: CI Dev

on:
  workflow_dispatch:
  push:
    branches: [dev]

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  ci-dev:
    name: Build and Push Dev Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION \
            | docker login --username AWS --password-stdin $ECR_REGISTRY

      - name: Build dev Docker image
        run: |
          docker build \
            -f Dockerfile.dev \
            --target production \
            -t $ECR_REPOSITORY:dev-latest \
            -t $ECR_REPOSITORY:dev-${{ github.sha }} \
            .

      - name: Tag and push dev image to ECR
        run: |
          docker tag $ECR_REPOSITORY:dev-latest $ECR_REGISTRY/$ECR_REPOSITORY:dev-latest
          docker tag $ECR_REPOSITORY:dev-${{ github.sha }} $ECR_REGISTRY/$ECR_REPOSITORY:dev-${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:dev-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:dev-${{ github.sha }}
